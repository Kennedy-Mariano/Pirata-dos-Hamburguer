# Sobe o DeliveryBot (Flask) e o WAHA (WhatsApp) e deixa os dois no ar.
# O Docker Desktop já inicia com o Windows; restart: unless-stopped sobe
# de novo se o PC reiniciar e o usuário entrar na conta.
#
# Todas as credenciais vêm do arquivo .env na MESMA pasta deste
# docker-compose.yml (o Docker Compose lê .env automaticamente) -- nada de
# senha fixa aqui no arquivo. A senha da cozinha NÃO está no .env: o
# iniciar.ps1 (ou quem sobe o compose) passa COZINHA_SENHA na hora, a partir
# de data\cozinha.senha. Ver MANUAL.md, seção "Segurança".
#
# Uso:
#   1. Preencha o .env (WAHA_API_KEY, WAHA_DASHBOARD_USERNAME/PASSWORD,
#      WEBHOOK_SECRET) -- veja .env.example.
#   2. Suba os serviços:  docker compose up -d
#   3. Abra http://localhost:5000/whatsapp e escaneie o QR Code.
#      O webhook do WAHA aponta para o container do Flask.
#   4. (Opcional, pesado) N8N não sobe no comando acima. Para ligar:
#      docker compose --profile n8n up -d
#
# Este PC tem pouca RAM. O compose desliga a IA (Ollama) de propósito:
# o menu fixo responde na hora e o modelo de 2 GB não entra na memória.

services:
  app:
    build: .
    image: deliverybot-app
    container_name: deliverybot-app
    restart: unless-stopped
    ports:
      # O notebook continua em localhost. Quem está fora entra pelo túnel.
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/deliverybot.db
      FLASK_DEBUG: "false"
      # No container, localhost é o próprio Flask. O WAHA é o serviço ao lado.
      WAHA_URL: http://waha:3000
      # O .env pede Ollama. Neste PC isso troca a memória e cada mensagem
      # espera o modelo até desistir. Menu fixo fica no lugar.
      IA_PROVIDER: ""
      OLLAMA_AQUECER_AO_INICIAR: "false"
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      COZINHA_SENHA: ${COZINHA_SENHA:-}
    volumes:
      - ./data:/app/data
    networks:
      - deliverybot

  # Túnel gratuito da Cloudflare. Não precisa de conta. A URL muda se este
  # container reiniciar; nesse caso o BASE_URL do .env tem que ser atualizado.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: deliverybot-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:5000
    depends_on:
      - app
    networks:
      - deliverybot

  waha:
    image: devlikeapro/waha
    container_name: deliverybot-waha
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Só o próprio notebook acessa o WAHA (nada de abrir para a rede/internet).
      - "127.0.0.1:3000:3000"
    environment:
      # Aponta direto pro Flask, já com o segredo do webhook embutido na URL
      # -- sem ele, o Flask rejeita a requisição (ver src/app.py).
      WHATSAPP_HOOK_URL: "http://app:5000/webhook/waha/${WEBHOOK_SECRET}"
      WHATSAPP_HOOK_EVENTS: "message"
      # A engine WEBJS tem um bug conhecido ("No LID for user") com
      # atualizações recentes do WhatsApp Web. GOWS é a engine recomendada
      # pela própria comunidade do WAHA pra evitar esse erro.
      WHATSAPP_DEFAULT_ENGINE: GOWS
      # Reinicia automaticamente as sessões já salvas quando o container
      # sobe (sem precisar escanear o QR Code de novo).
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      # Cria e inicia a sessão "default" sozinho -- assim o QR Code já
      # aparece em http://localhost:5000/whatsapp sem ninguém clicar em nada.
      WHATSAPP_START_SESSION: default
      WAHA_DASHBOARD_ENABLED: "true"
      # Credenciais do dashboard/Swagger do WAHA -- lidas do .env deste
      # projeto (mesma pasta). Troque os valores padrão antes de usar de
      # verdade: ver .env.example.
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_API_KEY: ${WAHA_API_KEY}
    volumes:
      - waha_sessions:/app/.sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deliverybot

  n8n:
    image: n8nio/n8n
    container_name: deliverybot-n8n
    profiles: ["n8n"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deliverybot

networks:
  deliverybot:
    driver: bridge

volumes:
  waha_sessions:
  n8n_data:
